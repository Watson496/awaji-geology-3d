[project]
name = "awaji-geology-3d"
version = "0.1.0"
description = "GemPy-based subsurface geology of Awaji Island"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gempy==2026.0.3",
    "numpy",
    "scipy",
    "pillow",
    "pyproj",
    "requests",
    "scikit-image",
    "pyshp>=3.1.7",
    "pypdf>=7.0.0",
    "cryptography>=50.0.2",
    "shapely>=2.2.0",
]

[tool.uv]
package = false
