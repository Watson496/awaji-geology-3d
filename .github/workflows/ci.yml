name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0" # mise.toml と揃える
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:geometry
      - run: npm run build
        env:
          BASE_PATH: /awaji-geology-3d/
